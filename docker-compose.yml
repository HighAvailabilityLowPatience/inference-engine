version: "3.9"

services:
  backend:
    container_name: ml_backend
    image: ghcr.io/highavailabilitylowpatience/ml-backend:latest
    ports:
      - "8000:8000"
    environment:
      - USE_FAKE=false
    restart: unless-stopped

  ui:
    container_name: telemetry_ui
    build:
      context: ./ui
      dockerfile: Dockerfile
    ports:
      - "3000:8080"
    environment:
      # UI will call backend via http://localhost:8000
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped
